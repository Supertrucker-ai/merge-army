<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1238;overscroll-behavior:none;position:fixed;width:100%;
 font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;color:#fff}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--sat) var(--sar) var(--sab) var(--sal);max-width:560px;margin:0 auto}
button{font:inherit;font-weight:900;color:#fff;border:0;border-radius:18px;touch-action:manipulation;cursor:pointer;letter-spacing:.2px}
button:active{transform:scale(.95)}
.hidden{display:none!important}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffd000 45%,#e29a00);border:.12em solid #b87400;vertical-align:-.15em;box-shadow:inset 0 0 0 .1em rgba(255,255,255,.35)}
#hud{flex:none;height:58px;display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:linear-gradient(#18215a,#101842);border-bottom:3px solid #0a0f2c}
#lvl{display:flex;flex-direction:column;line-height:1.05;min-width:96px}
#lvl span{font-size:18px;font-weight:900}
#lvl small{font-size:13px;color:#9fd1ff;font-weight:800}
#army{display:flex;flex-direction:column;align-items:center;line-height:1}
#army small{font-size:11px;color:#8ab8ff;letter-spacing:1.5px}
#army b{font-size:30px;color:#4db3ff;text-shadow:0 2px 0 #08306b,0 0 12px rgba(80,170,255,.7);font-variant-numeric:tabular-nums}
#army.pulse b{animation:pulse .25s}
@keyframes pulse{50%{transform:scale(1.18)}}
#coins{min-width:96px;display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:22px}
#coins .coin{width:22px;height:22px}
#coins b{font-variant-numeric:tabular-nums;color:#ffe45c;text-shadow:0 2px 0 #7a4a00}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#000}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#bar{flex:none;height:76px;display:flex;gap:8px;padding:8px 10px;background:linear-gradient(#e8c47a,#c99a4b);border-top:4px solid #8a5f22}
#bar button{height:100%;box-shadow:0 4px 0 rgba(0,0,0,.28)}
#buyBtn{flex:1 1 auto;background:linear-gradient(#3dd86a,#16a34a);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border:3px solid #0d6b2d}
#buyBtn .t{font-size:18px}
#buyBtn .p{font-size:20px;color:#fff7a8;display:flex;align-items:center;gap:5px}
#buyBtn.poor{background:linear-gradient(#8a9a8f,#66756b);border-color:#44514a}
#buyBtn.full{background:linear-gradient(#ffb23d,#e07a00);border-color:#8a4a00}
#upBtn{width:92px;background:linear-gradient(#ffb23d,#f47a00);border:3px solid #9a4d00;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1}
#upBtn span{font-size:12px}
#upBtn.glow{animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(255,255,255,.7),0 4px 0 rgba(0,0,0,.28)}}
.sq{width:50px;background:linear-gradient(#6aa7ff,#2f6fe0);border:3px solid #1c46a0;font-size:22px;padding:0}
#starBtn{position:absolute;right:8px;top:78px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff59a,#ffc400 60%,#e08a00);border:4px solid #fff;font-size:30px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:bob 1s infinite;z-index:5;padding:0;box-shadow:0 0 18px rgba(255,230,80,.9)}
#starBtn span{font-size:11px;color:#7a3d00;margin-top:-2px}
@keyframes bob{50%{transform:scale(1.12) rotate(6deg)}}
#boostBadge{position:absolute;left:50%;transform:translateX(-50%);top:34px;background:linear-gradient(#ffe45c,#ff9d00);color:#5a2a00;padding:6px 14px;border-radius:20px;font-size:17px;border:3px solid #fff;z-index:5}
#toast{position:absolute;left:calc(50% - 40px);top:80px;transform:translate(-50%,10px);background:rgba(0,0,0,.7);padding:8px 14px;border-radius:16px;font-size:16px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:6;max-width:calc(100% - 96px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,10,40,.74);z-index:20;padding:12px}
.ov.on{display:flex}
.ov.clear{background:rgba(6,10,40,.28)}
.panel{background:linear-gradient(#2a3a9a,#1a2570);border:4px solid #fff;border-radius:26px;padding:16px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.35);animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.logo{font-size:46px;line-height:1;font-weight:900;color:#ffe45c;text-shadow:0 4px 0 #b25a00,0 0 18px rgba(255,200,0,.6);margin-top:4px}
.tag{font-size:18px;color:#9fd1ff;margin:8px 0}
.rocket{font-size:70px;animation:bob 1.6s infinite;margin:6px 0}
.cta{display:block;width:100%;min-height:64px;font-size:28px;margin:10px 0;background:linear-gradient(#3dd86a,#16a34a);border:4px solid #0d6b2d;box-shadow:0 5px 0 #0a4d20}
.sec{min-height:52px;font-size:18px;padding:8px 14px;background:linear-gradient(#ffb23d,#f47a00);border:3px solid #9a4d00;box-shadow:0 4px 0 #6b3300}
.row2{display:flex;gap:10px;justify-content:center}
.row2 .sec{flex:1}
.small{font-size:14px;color:#9fb4ff;margin-top:12px}
.big1{font-size:30px;font-weight:900;color:#ffe45c;text-shadow:0 3px 0 #b25a00;margin:4px 0 8px}
.sub{font-size:17px;color:#d6e4ff;margin-bottom:8px;line-height:1.25}
.earn{font-size:24px;color:#ffe45c;margin:8px 0}
.fact{background:rgba(0,0,0,.28);border-radius:16px;padding:10px 12px;margin:8px 0 12px;font-size:16px;line-height:1.3;color:#d9f0ff}
.win .sec,.lose .sec{width:100%}
.lose{background:linear-gradient(#7a2a5a,#4a1a50)}
.sheet{display:flex;flex-direction:column;max-height:calc(100% - 4px);padding:12px;max-width:420px;height:min(640px,100%)}
.sheetHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheetHead h2{margin:0;font-size:24px;flex:1;text-align:left;color:#ffe45c}
.cc{display:flex;align-items:center;gap:6px;font-size:20px;color:#ffe45c}
.x{width:48px;height:48px;background:#e0443e;border:3px solid #fff;font-size:22px;padding:0;border-radius:50%}
.list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding:2px 2px 8px;min-height:0}
.item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);border-radius:18px;padding:10px;text-align:left;flex:none}
.item .ic{font-size:34px;width:46px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .nm{font-size:19px;line-height:1.1}
.item .ds{font-size:14px;color:#b9d2ff;margin-top:3px;font-weight:700;line-height:1.2}

function slotRect(i){const c=i%COLS,r=(i/COLS)|0;return{x:LAY.gx0+c*(SLOT+GAP),y:LAY.sandTop+12+r*(SLOT+GAP),w:SLOT,h:SLOT}}

function fmt(n){
  if(!isFinite(n))return '∞';

  let i=0,v=n;while(v>=999.5&&i<SUF.length-1){v/=1000;i++}
  if(v>=999.5)return n.toExponential(1).replace('e+','e');

}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(L){
  const r=Math.random();
  if(r<0.3){const t=TRIVIA[Math.floor(Math.random()*TRIVIA.length)];return{kind:'trivia',q:t[0],ans:t[1],choices:shuffle([t[1],t[2][0],t[2][1]]),small:true}}
  const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const hi=Math.min(5+L,12);let q,ans;const k=ri(0,5);
  if(k===0){const a=ri(2,hi+3),b=ri(2,hi+3);q=a+' + '+b+' = ?';ans=a+b}
  else if(k===1){const a=ri(2,Math.min(4+Math.floor(L/2),10)),b=ri(1,Math.min(3+Math.floor(L/2),10));q=a+' × '+b+' = ?';ans=a*b}
  else if(k===2){const v=ri(2,5),g=ri(2,5);q='A group of '+v+' goes through a ×'+g+' gate. How many?';ans=v*g}
  else if(k===3){const a=ri(3,hi+6);q='Double '+a+' = ?';ans=a*2}
  else if(k===4){const b=ri(2,9),a=b+ri(1,10);q=a+' − '+b+' = ?';ans=a-b}
  else {const a=ri(1,4)*10,b=ri(1,9);q=a+' + '+b+' + '+b+' = ?';ans=a+2*b}
  const set=new Set([ans]);const cand=[ans+1,ans-1,ans+2,ans-2,ans+10,ans*2,ans+3,ans-3];shuffle(cand);
  for(const c of cand){if(set.size>=3)break;if(c>0&&c!==ans)set.add(c)}
  return{kind:'math',q,ans:String(ans),choices:shuffle([...set].map(String)),small:false,bigq:q.length>14}
}

// ===== SAVE (localStorage -> sessionStorage -> window.name -> memory) =====
const Store=(function(){
  let ls=null,ss=null,mem=null;const PRE='MAsave:';
  try{ls=window.localStorage;ls.setItem('__t','1');ls.removeItem('__t')}catch(e){ls=null}
  try{ss=window.sessionStorage;ss.setItem('__t','1');ss.removeItem('__t')}catch(e){ss=null}
  function read(){let raw=null;
    if(ls){try{raw=ls.getItem(SAVE_KEY)}catch(e){}}
    if(!raw&&ss){try{raw=ss.getItem(SAVE_KEY)}catch(e){}}
    if(!raw){try{if(window.name&&window.name.indexOf(PRE)===0)raw=window.name.slice(PRE.length)}catch(e){}}
    return raw||mem}
  function write(s){mem=s;
    if(ls){try{ls.setItem(SAVE_KEY,s)}catch(e){}}
    if(ss){try{ss.setItem(SAVE_KEY,s)}catch(e){}}
    try{window.name=PRE+s}catch(e){}}
  return{read,write,kind:ls?'localStorage':ss?'sessionStorage':'window.name'};
})();
const DEF_SAVE=()=>({v:1,coins:0,level:1,maxLevel:1,up:{gate:0,speed:0,wall:0,start:0,coin:0},bestTier:1,tut:0,sound:true,wins:0,losses:0});

function loadSave(){

    for(const k in SV.up)if(typeof SV.up[k]!=='number'||!(SV.up[k]>=0))SV.up[k]=0;}}catch(e){SV=DEF_SAVE()}
}

const Snd=(function(){
  let ctx=null,master=null,last={};
  function unlock(){
    if(!ctx){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination)}catch(e){ctx=null;return}}
    if(ctx.state==='suspended')ctx.resume();
  }
  function ok(name,gap){const n=performance.now();if(last[name]&&n-last[name]<gap)return false;last[name]=n;return !!ctx&&SV.sound&&ctx.state==='running'}
  function tone(f,d,type,vol,slide,delay){
    const t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
  }
  function noise(d,vol,f,delay){
    const t=ctx.currentTime+(delay||0),n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=ctx.createBufferSource();s.buffer=b;const fl=ctx.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f||1200;
    const g=ctx.createGain();g.gain.value=vol||.2;s.connect(fl);fl.connect(g);g.connect(master);s.start(t);
  }
  const N=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880,1046.5];
  return{unlock,
    click(){if(ok('click',50)){tone(660,.07,'triangle',.18,880)}},

    coin(){if(ok('coin',70)){tone(988,.07,'square',.1);tone(1319,.14,'square',.1,0,.06)}},
    buy(){if(ok('buy',50)){tone(523,.08,'triangle',.25);tone(784,.08,'triangle',.25,0,.07);tone(1046,.16,'triangle',.25,0,.14)}},
    gate(good,v){if(ok('gate',70)){good?tone(500+Math.min(v||0,8)*60,.12,'sine',.12,900):tone(300,.15,'sawtooth',.1,150)}},
    gatePick(){if(ok('gp',50)){tone(392,.08,'square',.14);tone(784,.12,'square',.14,0,.07)}},
    shoot(){if(ok('shoot',90)){tone(900,.05,'square',.04,500)}},
    clash(){if(ok('clash',110)){noise(.08,.08,900+Math.random()*900)}},
    fling(){if(ok('fling',120)){tone(300,.25,'sine',.12,900)}},
    swat(){if(ok('swat',200)){noise(.22,.35,500);tone(160,.25,'sawtooth',.25,60)}},
    roar(){if(ok('roar',500)){tone(110,.7,'sawtooth',.3,55);tone(165,.6,'square',.12,70);noise(.5,.2,300)}},
    bonk(){if(ok('bonk',250)){tone(120,.25,'sine',.4,50);noise(.15,.3,400)}},
    wall(){if(ok('wall',300)){tone(90,.15,'sine',.25,60)}},
    win(){if(!ok('win',0))return;[0,2,4,7,9,7,9,10].forEach((n,i)=>tone(N[n%N.length]*(n>=7?2:1),.2,'triangle',.28,0,i*.11));noise(.5,.15,5000,.5)},
    lose(){if(!ok('lose',0))return;tone(392,.3,'triangle',.3,330);tone(330,.3,'triangle',.3,260,.25);tone(262,.6,'triangle',.3,150,.5)},
    good(){if(ok('good',100)){tone(660,.1,'triangle',.25);tone(990,.2,'triangle',.25,0,.09)}},

    ctx(){return ctx}

function gateEff(g){return g.op==='mul'?g.v+U('gate'):g.op==='add'?g.v+5*U('gate'):g.v}
function gateApply(n,g){const e=gateEff(g);return g.op==='mul'?n*e:g.op==='add'?n+e:Math.max(0,n-e)}

function rollGate(L,allowNeg,avoid){
  const mulPool=[2,3,5];if(L>=4)mulPool.push(10);if(L>=8)mulPool.push(20);if(L>=14)mulPool.push(50);
  const addPool=[5,10,20];if(L>=3)addPool.push(50);if(L>=7)addPool.push(100);if(L>=12)addPool.push(500);
  const subPool=[5];if(L>=4)subPool.push(10);if(L>=8)subPool.push(50);
  for(let tries=0;tries<20;tries++){
    const r=Math.random();let g;
    if(allowNeg&&L>=2&&r<0.16)g={op:'sub',v:subPool[Math.floor(Math.random()*subPool.length)]};
    else if(r<0.62)g={op:'mul',v:mulPool[Math.floor(Math.random()*mulPool.length)]};
    else g={op:'add',v:addPool[Math.floor(Math.random()*addPool.length)]};
    if(avoid&&avoid.some(a=>a.op===g.op&&a.v===g.v))continue;
    return g;
  }
  return{op:'mul',v:2};
}
function newGate(g){return Object.assign(g,{flash:0,flip:1,t:0,life:rand(14,22)})}
function bestGateIdx(v){let bi=0,bv=-1;S.gates.forEach((g,i)=>{const o=gateApply(v,g);if(o>bv){bv=o;bi=i}});return bi}
function maxVolley(){let m=1;for(const s of S.grid)if(s)m=Math.max(m,tierVolley(s.tier));return m}
// --- level plan ---
const TUNE={base:800,g:1.5};
function levelE(L){return TUNE.base*Math.pow(TUNE.g,L-1)}
function coinPool(L){return 60*Math.pow(1.3,L-1)}
function levelPlan(L){
  const E=levelE(L),K=Math.min(6,3+Math.floor((L-1)/3)),sum=K*(K+1)/2,waves=[];
  const sp=Math.max(15,22-Math.min(L,7));
  for(let i=0;i<K;i++)waves.push({t:4+i*sp,strength:0.45*E*(i+1)/sum});
  const lastT=waves[K-1].t;
  return{E,K,waves,bossT:lastT+14,bossHP:0.45*E,escort:0.1*E,boss:BOSSES[(L-1)%BOSSES.length],
    coinRate:coinPool(L)/(1.0*E),spd:24+Math.min(L,20)*0.6};
}
function wallMaxFor(L){return (90+0.28*levelE(L))*(1+0.25*U('wall'))}
function buyCost(){return Math.round(10*Math.pow(1.3,S.level-1)*Math.pow(1.18,S.bought))}
function dropTier(){return Math.max(1,S.maxTier-3)}
// --- soldiers/blobs ---
function soldCount(n){return Math.min(14,1+Math.round(2.3*Math.log10(n+1)))}
function blobR(n){return 6+3*Math.sqrt(soldCount(n))}
const BLOB_CAP=170;
function newBlob(x,y,n,side){return{x,y,n,r:blobR(n),ph:Math.random()*6.28,side,hit:0}}
function emptySlots(){const a=[];for(let i=0;i<NSLOTS;i++)if(!S.grid[i])a.push(i);return a}
function placeSpawner(i,tier,fall){S.grid[i]={tier,cd:Math.random()/tierRate(tier),kick:0,drop:fall?0.35:0,pop:fall?0:1,age:0};if(tier>S.maxTier)S.maxTier=tier;if(tier>SV.bestTier){SV.bestTier=tier;markDirty()}}
const START_ORDER=[7,6,8,5,9,12,11,13,10,14,2,1,3,0,4];
function startLayout(V){
  for(let b=1;b<80;b++){
    const unit=Math.pow(2,b-1),q=Math.floor(V/unit);let rem=V-q*unit;const list=[];
    for(let i=0;i<q;i++)list.push(b);
    for(let t=b-1;t>=1;t--){const u=Math.pow(2,t-1);if(rem>=u){list.push(t);rem-=u}}
    if(list.length<=NSLOTS)return list.sort((a,b)=>b-a);
  }
  return[1];
}
function startLevel(L){if(typeof Fx!=='undefined')Fx.clear();
  S.level=L;S.theme=THEMES[(L-1)%THEMES.length];S.plan=levelPlan(L);S.t=0;S.mode='play';S.endT=0;S.endShown=false;
  S.grid.fill(null);S.packets=[];S.blues=[];S.reds=[];S.parts=[];S.texts=[];S.jobs=[];S.boss=null;S.nextWave=0;S.bossSpawned=false;
  S.emit.forEach(e=>{e.acc=0;e.t=0});S.drag=null;S.bought=0;S.dropT=6;S.coinFrac=0;S.earned=0;S.boost=0;S.starT=26;S.starReady=false;
  S.unitsMade=0;S.kills=0;S.merges=0;S.maxTier=1;S.wallMax=wallMaxFor(L);S.wallHP=S.wallMax;S.shake=0;S.tutT=0;S.armyShown=0;
  S.tut=(L===1&&SV.tut<2)?SV.tut:2;
  const V=2+U('start'),list=startLayout(V);
  const order=(S.tut<2&&V===2)?[6,8]:START_ORDER;
  list.forEach((t,i)=>placeSpawner(order[i],t,false));
  if(L===1){S.gates=[newGate({op:'mul',v:2}),newGate({op:'add',v:10}),newGate({op:'mul',v:5})]}
  else{S.gates=[];for(let i=0;i<3;i++)S.gates.push(newGate(rollGate(L,i!==0,S.gates)))}
  S.sel=0;S.gates.forEach(g=>{g.life=rand(14,22)});
  if(L>1){S.sel=bestGateIdx(maxVolley())}
  Hooks.levelStart();
}
// --- coins ---
function addCoins(n){SV.coins+=n;markDirty()}
function earnCoins(units){
  const c=units*S.plan.coinRate*(1+0.1*U('coin'));S.coinFrac+=c;S.earned+=c;
  if(S.coinFrac>=1){const w=Math.floor(S.coinFrac);S.coinFrac-=w;addCoins(w);Snd.coin()}
}
// --- player actions ---
function buySpawner(){
  if(S.mode!=='play')return false;
  const cost=buyCost();
  if(SV.coins<cost){Hooks.toast('Need more coins! Beat some enemies 🪙');Snd.bad();return false}
  const e=emptySlots();if(!e.length){Hooks.toast('Merge spawners to make room!');Snd.bad();return false}
  SV.coins-=cost;S.bought++;markDirty();
  placeSpawner(e[Math.floor(Math.random()*e.length)],dropTier(),true);Snd.buy();return true;
}
function doMerge(a,b){
  const A=S.grid[a],B=S.grid[b];if(a===b||!A||!B||A.tier!==B.tier)return false;
  B.tier++;B.pop=0;B.cd=Math.min(B.cd,0.3);S.grid[a]=null;S.merges++;
  if(B.tier>S.maxTier)S.maxTier=B.tier;if(B.tier>SV.bestTier){SV.bestTier=B.tier;markDirty()}
  const c=slotCenter(b);
  for(let i=0;i<14;i++){const an=Math.random()*6.28,sp=rand(60,170);addPart({type:'spark',x:c.x,y:c.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-30,life:rand(.35,.7),t:0,col:i%2?tierLight(B.tier):'#fff',s:rand(2,4)})}
  addPart({type:'ring',x:c.x,y:c.y,life:.45,t:0,r:34,col:tierColor(B.tier)});
  addText(c.x,c.y-20,'L'+B.tier+'!',tierLight(B.tier),22,1.0);
  Snd.merge(B.tier);Hooks.merged(B.tier);
  if(S.tut===0&&S.level===1){S.tut=1;SV.tut=1;markDirty()}
  return true;
}
function moveOrSwap(a,b){const A=S.grid[a];if(!A||a===b)return;S.grid[a]=S.grid[b];S.grid[b]=A;Snd.drop()}
function selectGate(i){
  if(i<0||i>2)return;
  if(S.sel!==i){S.sel=i;Snd.gatePick();S.gates[i].flash=1;if(S.tut===1){S.tut=2;SV.tut=2;markDirty()}}
}
// --- effects ---
const MAXP=320;
function addPart(p){if(S.parts.length<MAXP)S.parts.push(p)}
function addText(x,y,text,col,size,life){if(S.texts.length<40)S.texts.push({x,y,text,col,size:size||16,life:life||.9,t:0})}
function fling(x,y,side,k){
  for(let i=0;i<k;i++){const an=-Math.PI/2+rand(-1.3,1.3),sp=rand(110,280);
    addPart({type:'sold',side,x:x+rand(-6,6),y:y+rand(-4,4),vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-60,rot:0,vr:rand(-12,12),life:rand(1.1,1.7),t:0})}
}
function poof(x,y,col,size,txt){addPart({type:'poof',x,y,life:.5,t:0,r:size||14,col:col||'#fff',txt})}
function confetti(n){
  const cols=['#ff4d4d','#ffd400','#3da5ff','#2ecc40','#ff4fa3','#b85cff','#ff9f1a','#fff'];
  for(let i=0;i<n;i++)Fx.add({x:rand(0,innerWidth),y:rand(-innerHeight*.3,-10),vx:rand(-60,60),vy:rand(80,260),rot:rand(0,6),vr:rand(-8,8),w:rand(6,11),h:rand(10,16),col:cols[i%cols.length],life:rand(2.4,4)});
}
// --- tick pieces ---
function stepSpawners(dt){
  for(let i=0;i<NSLOTS;i++){const sp=S.grid[i];if(!sp)continue;
    sp.age+=dt;if(sp.drop>0){sp.drop-=dt;continue}
    if(sp.pop<1)sp.pop=Math.min(1,sp.pop+dt*4);
    sp.kick=Math.max(0,sp.kick-dt*6);
    const rate=tierRate(sp.tier);sp.cd-=dt;
    if(sp.cd<=0){const k=Math.floor(-sp.cd*rate)+1;sp.cd+=k/rate;fireVolley(i,tierVolley(sp.tier)*k)}
  }
}
function fireVolley(i,v){
  const sp=S.grid[i];sp.kick=1;const c=slotCenter(i),gi=S.sel;
  if(S.packets.length<50){S.packets.push({x:c.x,y:c.y-12,sx:c.x,sy:c.y-12,tx:GATE_X[gi],ty:LAY.wallTop+WALL_H*0.5,t:0,dur:0.28+Math.random()*0.06,v,gi})}
  else arrive(v,gi);
  Snd.shoot();
}
function arrive(v,gi){
  const g=S.gates[gi];let out=gateApply(v,g);if(S.boost>0)out*=2;
  S.emit[gi].acc+=out;S.unitsMade+=out;g.flash=1;
  S.popT-=0;
  if(S.popT<=0&&S.texts.length<18){S.popT=0.11;
    const lab=g.op==='mul'?fmt(v)+'×'+fmt(gateEff(g))+'='+fmt(out):g.op==='add'?fmt(v)+'+'+fmt(gateEff(g))+'='+fmt(out):fmt(v)+'−'+fmt(gateEff(g))+'='+fmt(out);
    addText(GATE_X[gi]+rand(-26,26),LAY.wallTop-38,lab,g.op==='sub'?'#ff8a8a':'#fff27a',out>=1000?15:13,0.8);
    Snd.gate(g.op!=='sub',Math.log10(out+1)*2);
  }
}
function stepPackets(dt){
  const a=S.packets;let w=0;
  for(let i=0;i<a.length;i++){const p=a[i];p.t+=dt/p.dur;
    if(p.t>=1){arrive(p.v,S.sel===p.gi?p.gi:S.sel)}
    else{p.x=p.sx+(p.tx-p.sx)*p.t;p.y=p.sy+(p.ty-p.sy)*p.t;a[w++]=p}}
  a.length=w;
}
function stepEmit(dt){
  for(let i=0;i<3;i++){const e=S.emit[i];e.t+=dt;
    if(e.acc>0&&e.t>=0.2){spawnBlue(GATE_X[i]+rand(-14,14),LAY.wallTop-8,e.acc);e.acc=0;e.t=0}}
}
function spawnBlue(x,y,n){
  if(S.blues.length>=BLOB_CAP){let sm=0;for(let i=1;i<S.blues.length;i++)if(S.blues[i].n<S.blues[sm].n)sm=i;const b=S.blues[sm];b.n+=n;b.r=blobR(b.n);b.x=(b.x+x)/2;return b}
  const b=newBlob(x,y,n,0);S.blues.push(b);return b;
}
function spawnRed(x,y,n){
  if(S.reds.length>=BLOB_CAP){let sm=0;for(let i=1;i<S.reds.length;i++)if(S.reds[i].n<S.reds[sm].n)sm=i;const b=S.reds[sm];b.n+=n;b.r=blobR(b.n);return b}
  const b=newBlob(x,y,n,1);S.reds.push(b);return b;
}
function stepGates(dt){
  S.popT-=dt;
  for(let i=0;i<3;i++){const g=S.gates[i];g.flash=Math.max(0,g.flash-dt*4);g.flip=Math.max(0,g.flip-dt*3);g.t+=dt;
    if(g.t>=g.life&&i!==S.sel){const ng=newGate(rollGate(S.level,true,S.gates));S.gates[i]=ng;Snd.pop()}
    else if(g.t>=g.life&&i===S.sel){const ng=newGate(rollGate(S.level,false,S.gates));S.gates[i]=ng;Snd.pop()}}
}
function stepWaves(dt){
  const P=S.plan;
  while(S.nextWave<P.waves.length&&S.t>=P.waves[S.nextWave].t){
    const w=P.waves[S.nextWave++],nb=clamp(Math.round(Math.sqrt(w.strength)/2),3,26);
    for(let j=0;j<nb;j++)S.jobs.push({t:S.t+j*(2.6/nb),n:w.strength/nb*rand(.8,1.2),x:rand(24,336)});
    Hooks.wave(S.nextWave,P.K);
  }
  if(!S.bossSpawned&&S.nextWave>=P.waves.length){
    const clear=S.jobs.length===0&&S.reds.length===0;
    if(S.t>=P.bossT||(clear&&S.t>=P.waves[P.K-1].t+5)){spawnBoss()}
  }
  let w=0;for(let i=0;i<S.jobs.length;i++){const j=S.jobs[i];if(S.t>=j.t)spawnRed(j.x,-14,j.n);else S.jobs[w++]=j}S.jobs.length=w;
}
function spawnBoss(){
  const P=S.plan;S.bossSpawned=true;
  S.boss={x:180,y:-70,hp:P.bossHP,max:P.bossHP,r:42,kind:P.boss.kind,name:P.boss.name,swatCd:2,swing:0,hit:0,bonkT:1,dying:0,vy:0,rot:0};
  const nb=6;for(let j=0;j<nb;j++)S.jobs.push({t:S.t+1+j*.4,n:P.escort/nb,x:rand(40,320)});
  Snd.roar();S.shake=.5;addText(180,60,'BOSS!','#ff5a5a',34,1.6);Hooks.boss(P.boss.name);
}
function stepBattle(dt){
  const B=S.blues,R=S.reds,boss=S.boss&&S.boss.hp>0?S.boss:null,wt=LAY.wallTop,rate=S.plan.coinRate;
  // reds march down & bonk the wall
  let wallDmg=0;
  for(const r of R){
    const sp=S.plan.spd;r.ph+=dt*6;
    if(r.y<wt-8){r.y+=sp*dt;r.x+=Math.sin(S.anim*1.3+r.ph*.2)*6*dt;if(r.y>wt-8)r.y=wt-8}
    else wallDmg+=0.09*r.n*dt;
    r.x=clamp(r.x,10,350);if(r.hit>0)r.hit-=dt;
  }
  if(boss){
    boss.hit=Math.max(0,boss.hit-dt);boss.swing=Math.max(0,boss.swing-dt*2.2);
    const stopY=wt-boss.r*0.75;
    if(boss.y<stopY)boss.y+=Math.min(14,10+S.level*.4)*dt;
    else{boss.y=stopY;boss.bonkT-=dt;if(boss.bonkT<=0){boss.bonkT=1.6;boss.swing=1;S.wallHP-=S.wallMax*0.12;S.wallFlash=1;S.shake=.35;Snd.bonk();addText(boss.x,wt-30,'BONK!','#ffd0d0',26,.8)}}
    boss.swatCd-=dt;
    if(boss.swatCd<=0){let near=false;for(const b of B)if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+70){near=true;break}
      if(near){boss.swatCd=1.8;boss.swing=1;S.shake=.3;Snd.swat();addText(boss.x,boss.y+boss.r,'SWAT!','#ffe0a0',26,.8);
        for(const b of B){if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+85){const loss=Math.min(b.n,b.n*0.35+2);b.n-=loss;fling(b.x,b.y,0,Math.min(6,2+Math.log10(loss+1)|0));poof(b.x,b.y,'#fff',16)}}
      }else boss.swatCd=.2}
  }
  if(wallDmg>0){S.wallHP-=wallDmg;S.wallFlash=Math.max(S.wallFlash,.6);if(Math.random()<dt*3)Snd.wall()}
  // blues run toward nearest enemy
  const spd=95;
  for(const b of B){
    b.ph+=dt*9;if(b.hit>0)b.hit-=dt;
    let tx=null,ty=0,best=1e12;
    for(const r of R){const dx=r.x-b.x,dy=r.y-b.y,d=dx*dx+dy*dy;if(d<best){best=d;tx=r.x;ty=r.y}}
    if(boss){const dx=boss.x-b.x,dy=boss.y-b.y,d=dx*dx+dy*dy-boss.r*boss.r*2;if(d<best){best=d;tx=boss.x;ty=boss.y}}
    if(tx===null){tx=b.x+Math.sin(b.ph*.1)*20;ty=wt*0.5}
    const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1;
    if(d>4){b.x+=dx/d*spd*dt;b.y+=dy/d*spd*dt}
    b.x=clamp(b.x,8,352);b.y=Math.min(b.y,wt-4);
  }
  // clashes: one-for-one attrition
  let fl=0;
  for(const b of B){
    if(b.n<=0)continue;
    for(const r of R){
      if(r.n<=0)continue;const dx=r.x-b.x,dy=r.y-b.y,rr=b.r+r.r;
      if(dx*dx+dy*dy<rr*rr){
        const m=Math.min(b.n,r.n),take=Math.min(m,Math.max(1.5,m*3*dt));
        b.n-=take;r.n-=take;S.kills+=take;earnCoins(take);b.hit=r.hit=.1;
        if(fl<10&&Math.random()<.5){fl++;const k=Math.min(3,1+(Math.log10(take+1)|0));fling((b.x+r.x)/2,(b.y+r.y)/2,Math.random()<.5?0:1,k);if(Math.random()<.35)poof((b.x+r.x)/2,(b.y+r.y)/2,'#fff',10)}
        Snd.clash();
        if(b.n<=0)break;
      }
    }
    if(b.n>0&&boss){
      const dx=boss.x-b.x,dy=boss.y-b.y,rr=b.r+boss.r;
      if(dx*dx+dy*dy<rr*rr){const take=Math.min(b.n,boss.hp,Math.max(2,b.n*3*dt));b.n-=take;boss.hp-=take;boss.hit=.12;S.kills+=take;earnCoins(take);Snd.clash();
        if(fl<10&&Math.random()<.4){fl++;fling(b.x,b.y,0,1)}}
    }
  }
  // remove dead; silly fling
  let w=0;for(let i=0;i<B.length;i++){const b=B[i];if(b.n>=0.5){b.r=blobR(b.n);B[w++]=b}else{fling(b.x,b.y,0,3);poof(b.x,b.y,'#9fd0ff',b.r+4,Math.random()<.2?'POOF!':null)}}B.length=w;
  w=0;for(let i=0;i<R.length;i++){const r=R[i];if(r.n>=0.5){r.r=blobR(r.n);R[w++]=r}else{fling(r.x,r.y,1,3);poof(r.x,r.y,'#ffb0b0',r.r+4,Math.random()<.2?'POOF!':null)}}R.length=w;
  // coalesce idle blues
  S.fxT+=dt;
  if(S.fxT>0.35){S.fxT=0;
    for(let i=0;i<B.length;i++){const a=B[i];if(a.n<=0)continue;for(let j=i+1;j<B.length;j++){const c=B[j];if(c.n<=0)continue;
      if(Math.abs(a.x-c.x)<7&&Math.abs(a.y-c.y)<7){const t=a.n+c.n;a.x=(a.x*a.n+c.x*c.n)/t;a.y=(a.y*a.n+c.y*c.n)/t;a.n=t;a.r=blobR(t);c.n=0}}}
    w=0;for(let i=0;i<B.length;i++)if(B[i].n>0)B[w++]=B[i];B.length=w;
  }
}
function stepStar(dt){
  if(!S.starReady&&S.tut>=2){S.starT-=dt;if(S.starT<=0){S.starReady=true;Hooks.starReady(true)}}
}
function checkEnd(){
  if(S.boss&&S.boss.hp<=0&&S.mode==='play')return winLevel();
  if(S.wallHP<=0&&S.mode==='play')return loseLevel();
}
function winLevel(){
  S.mode='won';S.endT=0;const b=S.boss;b.dying=1;b.vy=-60;
  for(const r of S.reds){fling(r.x,r.y,1,4);poof(r.x,r.y,'#ffb0b0',r.r+6)}S.reds=[];S.jobs=[];
  const bonus=coinPool(S.level)*0.25*(1+0.1*U('coin'));S.earned+=bonus;addCoins(Math.round(bonus));
  SV.wins++;SV.level=Math.max(SV.level,S.level+1);SV.maxLevel=Math.max(SV.maxLevel,S.level+1);S.tut=2;SV.tut=2;saveNow();
  confetti(160);Snd.win();Snd.roar();S.shake=.6;Hooks.starReady(false);
}
function loseLevel(){
  S.mode='lost';S.endT=0;S.wallHP=0;SV.losses++;saveNow();S.shake=.9;Snd.lose();Snd.bonk();
  for(let i=0;i<30;i++)addPart({type:'brick',x:rand(20,340),y:LAY.wallTop+rand(0,WALL_H),vx:rand(-120,120),vy:rand(-260,-80),rot:0,vr:rand(-9,9),life:1.8,t:0});
  for(const r of S.reds){fling(r.x,r.y,1,2)}
  Hooks.starReady(false);
}
function stepParts(dt){
  const a=S.parts;let w=0;
  for(let i=0;i<a.length;i++){const p=a[i];p.t+=dt;if(p.t>=p.life)continue;
    if(p.type==='sold'||p.type==='brick'){p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}

function render(){

  const t=S.anim;

  const wt=LAY.wallTop;

  cracks();
  if(S.wallFlash>0){ctx.fillStyle='rgba(255,60,60,'+S.wallFlash*.4+')';ctx.fillRect(0,wt,LW,WALL_H)}
  if(S.mode!=='lost')drawGates();
  // armies
  const budget=700;
  drawBlobs(S.reds,1,budget);
  if(S.boss)drawBoss(S.boss,t);
  drawBlobs(S.blues,0,budget);
  // packets
  if(S.packets.length){ctx.fillStyle='#bfe0ff';ctx.beginPath();for(const p of S.packets){ctx.moveTo(p.x+3.5,p.y);ctx.arc(p.x,p.y,3.5,0,6.3)}ctx.fill();

    const pop=sp.pop<1?1+Math.sin(sp.pop*3.14)*.25:1;

    if(S.drag&&S.grid[S.drag.from]&&S.grid[S.drag.from].tier===sp.tier){rr(ctx,slotRect(i).x-2,slotRect(i).y-2,SLOT+4,SLOT+4,14);ctx.strokeStyle='rgba(255,255,255,'+(.6+.4*Math.sin(t*10))+')';ctx.lineWidth=3;ctx.stroke()}
    drawSpawner(ctx,sp.tier,c.x,cy+off-2,sz*pop,sp.kick,t,hl);
    if(sp.drop<=0){drawSlotLabels(ctx,sp.tier,c.x,cy-2,sz);
      const rate=tierRate(sp.tier),f=clamp(1-sp.cd*rate,0,1);const r=slotRect(i);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(r.x+8,r.y+r.h-4,r.w-16,3);ctx.fillStyle=tierLight(sp.tier);ctx.fillRect(r.x+8,r.y+r.h-4,(r.w-16)*f,3)}
  }

  drawWallHP();

function drawParts(){
  const P=S.parts;if(!P.length)return;
  ctx.lineCap='butt';

    ctx.strokeStyle=ctx.fillStyle=side?'#e6262b':'#2f7bff';ctx.lineWidth=2;ctx.beginPath();let any=false;
    let nS=0;for(const p of P){if(p.type!=='sold'||p.side!==side)continue;if(++nS>90)break;any=true;const c=Math.cos(p.rot),s=Math.sin(p.rot);const pt=(x,y)=>[p.x+x*c-y*s,p.y+x*s+y*c];
      let a=pt(0,-3),b=pt(0,3);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);a=pt(-3.5,-1);b=pt(3.5,-1);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);a=pt(0,3);b=pt(-3,8);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);b=pt(3,8);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
      a=pt(0,-6);ctx.moveTo(a[0]+2.6,a[1]);ctx.arc(a[0],a[1],2.6,0,6.3)}

      if(p.txt)txt(ctx,p.txt,p.x,p.y-r-4-k*10,13,'#fff','#d02030')}
    else if(p.type==='spark'){ctx.globalAlpha=1-k;ctx.fillStyle=p.col;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);ctx.globalAlpha=1}

  }
}

  if(!down){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,12+Math.sin(t*8)*3,0,6.3);ctx.stroke()}
}

// ===== INPUT (pointer events on the canvas only; page scroll is blocked ONLY here) =====
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LAY.H}}
function slotAt(x,y,maxD){let best=-1,bd=maxD*maxD;for(let i=0;i<NSLOTS;i++){const c=slotCenter(i),d=(c.x-x)*(c.x-x)+(c.y-y)*(c.y-y);if(d<bd){bd=d;best=i}}return best}
function dropTarget(x,y,from){
  // the spawner is drawn 26px above the finger: accept the slot under the picture OR under the finger (prefer a same-tier match)
  const c=[slotAt(x,y-26,38),slotAt(x,y,34)].filter(i=>i>=0&&i!==from);
  const A=from!=null&&S.grid[from];
  if(A)for(const i of c)if(S.grid[i]&&S.grid[i].tier===A.tier)return i;
  return c.length?c[0]:-1;
}
let activePtr=null;
cv.addEventListener('pointerdown',e=>{
  Snd.unlock();if(S.mode!=='play'||paused||activePtr!==null)return;
  const p=toLogical(e),wt=LAY.wallTop;
  if(p.y>wt-18&&p.y<wt+WALL_H+10){let bi=0,bd=1e9;for(let i=0;i<3;i++){const d=Math.abs(p.x-GATE_X[i]);if(d<bd){bd=d;bi=i}}selectGate(bi);return}
  const i=slotAt(p.x,p.y,34);
  if(i>=0&&S.grid[i]&&S.grid[i].drop<=0){activePtr=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    S.drag={from:i,x:p.x,y:p.y,over:-1};Snd.pick();e.preventDefault()}
});
cv.addEventListener('pointermove',e=>{
  if(activePtr!==e.pointerId||!S.drag)return;const p=toLogical(e);S.drag.x=p.x;S.drag.y=p.y;S.drag.over=dropTarget(p.x,p.y,S.drag.from);
});
function endDrag(e,cancel){
  if(activePtr!==e.pointerId)return;activePtr=null;const d=S.drag;S.drag=null;if(!d||cancel)return;
  const t=dropTarget(d.x,d.y,d.from);if(t<0||t===d.from)return;
  const A=S.grid[d.from],B=S.grid[t];if(!A)return;
  if(!B){S.grid[t]=A;S.grid[d.from]=null;Snd.drop()}
  else if(B.tier===A.tier&&B.drop<=0)doMerge(d.from,t);
  else if(B.drop<=0)moveOrSwap(d.from,t);
}
cv.addEventListener('pointerup',e=>endDrag(e,false));
cv.addEventListener('pointercancel',e=>endDrag(e,true));
cv.addEventListener('lostpointercapture',e=>{if(activePtr===e.pointerId)endDrag(e,true)});
// block scrolling/zoom gestures on the game canvas only (never globally: lists in overlays must scroll)
cv.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
cv.addEventListener('touchstart',e=>{e.preventDefault()},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
['gesturestart','gesturechange','gestureend'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
['touchend','click','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,()=>Snd.unlock(),{passive:true}));

// ===== UI (DOM overlays, HUD) =====
const $=id=>document.getElementById(id);
let paused=false,uiBack='title',lastHud=0;
const ICONS={Moon:'🌕',Mars:'🔴',Egypt:'🇪🇬',Venus:'🟠',Jupiter:'🟤',Japan:'🇯🇵',Saturn:'🪐',Uranus:'🔵',France:'🇫🇷',Neptune:'🌀',Mercury:'⚪',Brazil:'🇧🇷',Pluto:'🪨','Asteroid Belt':'☄️',Australia:'🇦🇺',Antarctica:'🐧'};
function showOv(id){for(const o of ['ovTitle','ovWin','ovLose','ovUp','ovMap','ovQuiz'])$(o).classList.toggle('on',o===id);
  paused=(id==='ovUp'||id==='ovMap'||id==='ovQuiz'||id==='ovTitle')}
function hideOv(){showOv(null);paused=false}
function curOv(){for(const o of ['ovTitle','ovWin','ovLose','ovUp','ovMap','ovQuiz'])if($(o).classList.contains('on'))return o;return null}
let toastT=0;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}
const Hooks={
  levelStart(){$('lvlN').textContent='Level '+S.level;$('lvlName').textContent=(ICONS[S.theme.n]||'')+' '+S.theme.n;$('starBtn').classList.add('hidden');$('boostBadge').classList.add('hidden');S.armyShown=0},
  toast,
  merged(t){$('army').classList.remove('pulse');void $('army').offsetWidth;$('army').classList.add('pulse')},
  wave(i,k){toast('⚔️ Wave '+i+' of '+k+' is coming!')},
  boss(n){toast('⚠️ '+n+' appears!')},
  starReady(v){$('starBtn').classList.toggle('hidden',!v)},
  showWin(){
    $('winSub').textContent='You beat the '+S.plan.boss.name+' on '+S.theme.n+'!';
    $('winCoins').innerHTML='You earned <i class="coin"></i> '+fmt(Math.round(S.earned));
    $('winFact').textContent='🌍 Fun fact: '+S.theme.fact;
    $('winNext').textContent='Next Level '+(S.level+1)+' ▶';
    showOv('ovWin');paused=false;
  },
  showLose(){$('loseCoins').innerHTML='Your coins are safe: <i class="coin"></i> '+fmt(SV.coins);showOv('ovLose');paused=false}
};
// ----- upgrades -----
const UPS=[
 {k:'gate',ic:'🚪',nm:'Gate Power',cost:l=>Math.round(30*Math.pow(1.7,l)),desc:l=>'Every × gate gets +1 bigger and every + gate gets +5! Now: ×2 gate = ×'+(2+l)},
 {k:'speed',ic:'⚡',nm:'Spawn Speed',cost:l=>Math.round(25*Math.pow(1.6,l)),desc:l=>'New spawners drop faster and everything fires faster. Now: drop every '+(8/(1+.1*l)).toFixed(1)+'s, fire +'+(5*l)+'%'},
 {k:'wall',ic:'🧱',nm:'Wall HP',cost:l=>Math.round(20*Math.pow(1.5,l)),desc:l=>'A stronger wall that takes more bonks. Now: +'+(25*l)+'% wall HP'},
 {k:'start',ic:'🏁',nm:'Starting Spawners',cost:l=>Math.round(40*Math.pow(1.9,l)),desc:l=>'Start every level with more spawners! Now: '+(2+l)+' spawners worth of army'},
 {k:'coin',ic:'🪙',nm:'Coin Boost',cost:l=>Math.round(50*Math.pow(1.8,l)),desc:l=>'Earn more coins from battles. Now: +'+(10*l)+'% coins'}
];
function buyUpgrade(k){
  const d=UPS.find(u=>u.k===k),l=U(k),c=d.cost(l);
  if(SV.coins<c){Snd.bad();toast('Need more coins!');return}
  SV.coins-=c;SV.up[k]=l+1;Snd.buy();
  if(k==='wall'&&S.plan){const nm=wallMaxFor(S.level);S.wallHP+=nm-S.wallMax;S.wallMax=nm}
  saveNow();renderUpgrades();
}
function renderUpgrades(){
  $('upCoins').textContent=fmt(SV.coins);const list=$('upList');list.innerHTML='';
  for(const d of UPS){const l=U(d.k),c=d.cost(l),el=document.createElement('div');el.className='item';el.dataset.k=d.k;
    el.innerHTML='<div class="ic">'+d.ic+'</div><div class="tx"><div class="nm">'+d.nm+'<span class="lv">Lv '+l+'</span></div><div class="ds">'+d.desc(l)+'</div></div>';
    const b=document.createElement('button');b.className=SV.coins>=c?'':'poor';b.dataset.k=d.k;b.innerHTML='<span>Buy</span><span><i class="coin"></i> '+fmt(c)+'</span>';
    b.addEventListener('click',()=>{Snd.unlock();buyUpgrade(d.k)});el.appendChild(b);list.appendChild(el)}
  const n=document.createElement('div');n.className='item';n.innerHTML='<div class="ic">♾️</div><div class="tx"><div class="nm">No limits!</div><div class="ds">You can buy every upgrade again and again, forever. Coins are never lost, even when you lose a level.</div></div>';list.appendChild(n);
}
function openUpgrades(){uiBack=curOv()||(S.mode==='play'?null:'ovTitle');renderUpgrades();showOv('ovUp');Snd.click()}
function closeSheet(){Snd.click();if(uiBack&&uiBack!=='ovUp')showOv(uiBack);else hideOv();if(uiBack==='ovWin'||uiBack==='ovLose')paused=false}
function renderMap(){
  const list=$('mapList');list.innerHTML='';
  const hi=Math.min(SV.maxLevel+2,300);
  for(let l=hi;l>=1;l--){const T=THEMES[(l-1)%THEMES.length],locked=l>SV.maxLevel,el=document.createElement('div');el.className='item'+(locked?' locked':'')+(l===S.level&&S.mode==='play'?' cur':'');
    el.innerHTML='<div class="ic">'+(locked?'🔒':ICONS[T.n]||'🌍')+'</div><div class="tx"><div class="nm">Level '+l+' · '+T.n+'</div><div class="ds">'+(locked?'Win earlier levels to unlock!':T.fact)+'</div></div>';
    if(!locked){const b=document.createElement('button');b.textContent='Play';b.dataset.level=l;b.addEventListener('click',()=>{Snd.unlock();Snd.click();hideOv();startLevel(l)});el.appendChild(b)}
    list.appendChild(el)}
}
function openMap(){uiBack=curOv()||(S.mode==='play'?null:'ovTitle');renderMap();showOv('ovMap');Snd.click()}
// ----- math star question -----
let curQ=null,qDone=false;
function openQuiz(){
  if(S.mode!=='play'||!S.starReady)return;curQ=makeQuestion(S.level);qDone=false;
  $('qText').textContent=curQ.q;$('qText').style.fontSize=curQ.q.length>24?'24px':'30px';$('qMsg').textContent='';
  const a=$('qAns');a.innerHTML='';a.classList.toggle('small',!!curQ.small);
  for(const c of curQ.choices){const b=document.createElement('button');b.textContent=c;b.dataset.v=c;b.addEventListener('click',()=>answerQuiz(b,c));a.appendChild(b)}
  $('qSkip').classList.remove('hidden');showOv('ovQuiz');Snd.click();
}
function answerQuiz(btn,c){
  if(qDone)return;
  if(c===curQ.ans){qDone=true;btn.classList.add('ok');Snd.good();
    const coins=Math.ceil(coinPool(S.level)*0.12*(1+0.1*U('coin')));addCoins(coins);S.boost=Math.max(S.boost,10);S.earned+=coins;S.starReady=false;S.starT=32;
    $('qMsg').textContent='🎉 Correct! +'+coins+' coins and ×2 boost!';$('qSkip').classList.add('hidden');confetti(40);
    setTimeout(()=>{if(curOv()==='ovQuiz'){hideOv();Hooks.starReady(false)}},1300);
  }else{btn.classList.add('bad');Snd.bad();$('qMsg').textContent='Not quite - try again! 💪'}
}
// ----- HUD refresh -----
function updateHUD(dt){
  let army=0;for(const b of S.blues)army+=b.n;for(const e of S.emit)army+=e.acc;
  S.armyShown+=(army-S.armyShown)*Math.min(1,dt*10);if(Math.abs(army-S.armyShown)<1)S.armyShown=army;
  $('armyN').textContent=fmt(S.armyShown);
  $('coinN').textContent=fmt(SV.coins);
  const cost=buyCost(),poor=SV.coins<cost,full=emptySlots().length===0;
  $('buyCost').textContent=fmt(cost);$('buyBtn').classList.toggle('poor',poor&&!full);$('buyBtn').classList.toggle('full',full);
  $('buyBtn').querySelector('.t').textContent=full?'Merge to make room!':'Buy Spawner';
  const bb=$('boostBadge');bb.classList.toggle('hidden',!(S.boost>0));if(S.boost>0)$('boostT').textContent=Math.ceil(S.boost);
  let afford=false;for(const d of UPS)if(SV.coins>=d.cost(U(d.k)))afford=true;
  $('upBtn').classList.toggle('glow',afford&&S.mode!=='play'?true:afford&&S.t>5&&S.level>1);
  $('sndBtn').textContent=SV.sound?'🔊':'🔇';
}
function wireUI(){
  const tap=(id,fn)=>$(id).addEventListener('click',e=>{Snd.unlock();fn(e)});
  tap('playBtn',()=>{Snd.click();hideOv();startLevel(SV.level)});
  tap('tUp',openUpgrades);tap('tMap',openMap);tap('upBtn',openUpgrades);tap('mapBtn',openMap);
  tap('upClose',closeSheet);tap('mapClose',closeSheet);
  tap('buyBtn',()=>{buySpawner()});
  tap('sndBtn',()=>{SV.sound=!SV.sound;markDirty();saveNow();if(SV.sound)Snd.click()});
  tap('winNext',()=>{Snd.click();hideOv();startLevel(S.level+1)});
  tap('winUp',openUpgrades);
  tap('loseRetry',()=>{Snd.click();hideOv();startLevel(S.level)});
  tap('loseUp',openUpgrades);
  tap('starBtn',openQuiz);
  tap('qSkip',()=>{Snd.click();hideOv()});
  $('logoName').textContent=GAME_NAME;
}

// ===== MAIN LOOP + test hooks =====
function bestGateMix(){
  let bi=0,bv=-1;S.gates.forEach((g,i)=>{let tot=0;for(const s of S.grid)if(s)tot+=tierRate(s.tier)*gateApply(tierVolley(s.tier),g);if(tot>bv){bv=tot;bi=i}});return bi;
}
function botAct(maxM){maxM=maxM||30; // plays like a kid who knows the rules (used by tests)
  if(S.mode!=='play')return;
  for(let guard=0;guard<maxM;guard++){
    let did=false;const by={};
    S.grid.forEach((s,i)=>{if(s&&s.drop<=0)(by[s.tier]=by[s.tier]||[]).push(i)});
    for(const t of Object.keys(by).map(Number).sort((a,b)=>a-b)){if(by[t].length>=2){doMerge(by[t][0],by[t][1]);did=true;break}}
    if(!did)break;
  }
  if(S.tut===0)S.tut=1;
  selectGate(bestGateMix());
  if(SV.coins>=buyCost()&&emptySlots().length>1)buySpawner();
}
function snapshot(){
  let army=0,red=0;for(const b of S.blues)army+=b.n;for(const r of S.reds)red+=r.n;
  return{mode:S.mode,level:S.level,theme:S.theme.n,t:S.t,coins:SV.coins,army,blueBlobs:S.blues.length,redBlobs:S.reds.length,red,
    wallHP:S.wallHP,wallMax:S.wallMax,boss:S.boss?{hp:S.boss.hp,max:S.boss.max,name:S.boss.name,kind:S.boss.kind,y:S.boss.y}:null,
    grid:S.grid.map(s=>s?s.tier:0),gates:S.gates.map(g=>({op:g.op,v:g.v,eff:gateEff(g),label:gateLabel(g)})),sel:S.sel,bought:S.bought,buyCost:buyCost(),
    up:Object.assign({},SV.up),save:JSON.parse(JSON.stringify(SV)),earned:S.earned,kills:S.kills,unitsMade:S.unitsMade,merges:S.merges,maxTier:S.maxTier,tut:S.tut,
    parts:S.parts.length,pending:S.emit.reduce((a,e)=>a+e.acc,0),confetti:Fx.count(),paused,overlay:curOv(),boost:S.boost,starReady:S.starReady,storage:Store.kind,wave:S.nextWave,waves:S.plan?S.plan.K:0,bossSpawned:S.bossSpawned};
}
function advance(sec,opts){
  opts=opts||{};const dt=1/30;let acc=0;
  for(let t=0;t<sec;t+=dt){
    if(opts.bot){acc+=dt;if(acc>=(opts.period||0.4)){acc=0;botAct(opts.maxM)}}
    update(dt);
    if(opts.stopAtEnd&&S.mode!=='play'&&S.endShown)break;
  }
  return snapshot();
}
function stressArmy(blobsPerSide,nPer){
  S.blues.length=0;S.reds.length=0;
  for(let i=0;i<blobsPerSide;i++){const b=newBlob(rand(10,350),rand(40,LAY.wallTop-30),nPer,0);S.blues.push(b);const r=newBlob(rand(10,350),rand(20,LAY.wallTop-60),nPer,1);S.reds.push(r)}
  for(let i=0;i<260;i++)fling(rand(20,340),rand(60,300),i%2,1);
}
function benchFrames(n){
  const t0=performance.now();let upd=0,rnd=0;
  for(let i=0;i<n;i++){const a=performance.now();update(1/60);const b=performance.now();render();const c=performance.now();upd+=b-a;rnd+=c-b}
  // force raster to be included
  ctx.getImageData(0,0,1,1);
  return{total:(performance.now()-t0)/n,update:upd/n,render:rnd/n};
}
window.__MA={TUNE,resetProgress:()=>{SV.up={gate:0,speed:0,wall:0,start:0,coin:0};SV.coins=0;saveNow()},setReached:n=>{SV.maxLevel=n;SV.level=n;saveNow()},quiz:()=>curQ,audio:()=>Snd.ctx()&&Snd.ctx().state,state:snapshot,advance,bot:botAct,startLevel:l=>{hideOv();startLevel(l)},buy:buySpawner,merge:doMerge,selectGate,stressArmy,benchFrames,
  gateApply:(n,op,v)=>gateApply(n,{op,v}),setGates:a=>{S.gates=a.map(g=>newGate({op:g.op,v:g.v}))},place:(i,t)=>placeSpawner(i,t,false),clearGrid:()=>S.grid.fill(null),
  giveCoins:n=>{addCoins(n);saveNow()},setWallHP:v=>{S.wallHP=v;S.wallMax=Math.max(S.wallMax,v)},fmt,slotCenter,slotRect,LAY,GATE_X,tierVolley,tierRate,
  spawnBoss:()=>{if(!S.bossSpawned)spawnBoss()},saveNow,reload:()=>loadSave(),UPS,buyUpgrade,openUpgrades,openMap,levelPlan,makeQuestion,
  forceStar:()=>{S.starReady=true;Hooks.starReady(true)},killReds:()=>{S.reds.length=0;S.jobs.length=0},setBossHP:v=>{if(S.boss)S.boss.hp=v},GAME_NAME,
  rates:()=>({volley:tierVolley,rate:tierRate}),theme:()=>S.theme};
let lastTs=0,hudAcc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000)||0.016);lastTs=ts;
  if(!paused)update(dt);
  Fx.step(dt);render();Fx.draw();
  hudAcc+=dt;if(hudAcc>.06){updateHUD(hudAcc);hudAcc=0}
  maybeSave();
}
function boot(){
  loadSave();wireUI();resize();
  startLevel(SV.level);S.mode='title';
  showOv('ovTitle');$('playBtn').textContent=SV.level>1?'▶ PLAY Level '+SV.level:'▶ PLAY';
  updateHUD(1);
  window.addEventListener('resize',()=>{resize()});window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
  requestAnimationFrame(frame);
}
boot();

})();
